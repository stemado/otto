<!DOCTYPE html>
<html>
<head><title>Network Test</title></head>
<body>
  <button id="fetch-json" onclick="fetch('/api/data').then(function(r){return r.json()}).then(function(d){document.getElementById('result').textContent=JSON.stringify(d)})">
    Fetch JSON
  </button>
  <button id="fetch-other" onclick="fetch('/api/other').then(function(r){return r.text()})">
    Fetch Other
  </button>
  <button id="fetch-download" onclick="fetch('/download')">Download File</button>
  <span id="result"></span>
</body>
</html>
