[project]
name = "otto"
version = "0.1.0"
description = "Stealth browser automation for Claude Code"
requires-python = ">=3.11"
authors = [{name = "sdoherty"}]
license = {text = "MIT"}
readme = "README.md"
keywords = ["browser", "automation", "anti-detection", "stealth", "mcp", "claude-code"]
dependencies = [
    "mcp[cli]>=1.0.0",
    "botasaurus-driver>=4.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
otto = "otto.server:main"
workflow-run = "otto.executor:main"

[project.urls]
Homepage = "https://github.com/stemado/otto"
Repository = "https://github.com/stemado/otto"
Issues = "https://github.com/stemado/otto/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring a real browser (deselect with -m 'not integration')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
